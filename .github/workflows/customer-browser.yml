name: Customer browser QA

on:
  pull_request:
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "qa/customer-browser.test.cjs"
      - "qa/demo-server.mjs"
      - "qa/demo-browser.test.cjs"
      - "qa/export-demo.mjs"
      - "qa/private-demo-sw.js"
      - "admin/**"
      - ".github/workflows/customer-browser.yml"
      - "assets/**"
      - "sw.js"
      - "manifest.webmanifest"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customer-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Start standalone demo server
        id: demo_server
        run: |
          node qa/demo-server.mjs > /tmp/customer-preview.log 2>&1 &
          echo $! > /tmp/customer-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/customer-preview.log
          exit 1
      - name: Run customer browser regression suite
        env:
          ADMIN_TEST_URL: http://127.0.0.1:8765
        run: |
          CHROMIUM_EXECUTABLE_PATH="$(node -p "require('playwright').chromium.executablePath()")" npm run qa:customer
      - name: Run standalone cross-tab browser integration
        if: ${{ !cancelled() && steps.demo_server.outcome == 'success' }}
        env:
          ADMIN_TEST_URL: http://127.0.0.1:8765
        run: |
          CHROMIUM_EXECUTABLE_PATH="$(node -p "require('playwright').chromium.executablePath()")" npm run qa:demo-browser
      - name: Build isolated private demo
        id: demo_export
        if: ${{ !cancelled() && steps.demo_server.outcome == 'success' }}
        run: npm run demo:export
      - name: Test exported private demo in Chromium
        if: ${{ !cancelled() && steps.demo_export.outcome == 'success' }}
        env:
          ADMIN_TEST_URL: http://127.0.0.1:8766
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 --directory dist/demo/public > /tmp/export-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8766/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8766/ > /dev/null
          CHROMIUM_EXECUTABLE_PATH="$(node -p "require('playwright').chromium.executablePath()")" npm run qa:demo-browser
      - name: Test static demo at a GitHub Pages-style project path
        if: ${{ !cancelled() && steps.demo_export.outcome == 'success' }}
        env:
          ADMIN_TEST_URL: http://127.0.0.1:8767/Online-Menu/
        run: |
          mkdir -p /tmp/online-menu-pages-qa
          cp -a dist/demo/public /tmp/online-menu-pages-qa/Online-Menu
          python3 -m http.server 8767 --bind 127.0.0.1 --directory /tmp/online-menu-pages-qa > /tmp/pages-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$ADMIN_TEST_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$ADMIN_TEST_URL" > /dev/null
          CHROMIUM_EXECUTABLE_PATH="$(node -p "require('playwright').chromium.executablePath()")" npm run qa:demo-browser
      - name: Upload browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-browser-qa
          path: docs/qa/
          if-no-files-found: ignore

  standalone-cross-browser:
    name: Standalone demo (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright browser
        env:
          DEMO_BROWSER_ENGINE: ${{ matrix.browser }}
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps "$DEMO_BROWSER_ENGINE"
      - name: Export isolated standalone demo
        run: npm run demo:export
      - name: Run cross-browser integration at project subpath
        env:
          DEMO_BROWSER_ENGINE: ${{ matrix.browser }}
          ADMIN_TEST_URL: http://127.0.0.1:8767/Online-Menu/
        run: |
          mkdir -p /tmp/online-menu-pages-qa
          cp -a dist/demo/public /tmp/online-menu-pages-qa/Online-Menu
          python3 -m http.server 8767 --bind 127.0.0.1 --directory /tmp/online-menu-pages-qa > /tmp/cross-browser-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$ADMIN_TEST_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$ADMIN_TEST_URL" > /dev/null
          npm run qa:demo-browser
