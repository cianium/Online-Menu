name: Vercel Supabase proxy smoke

on:
  pull_request:
    paths:
      - "vercel.json"
      - "qa/vercel-proxy-smoke.mjs"
      - ".github/workflows/vercel-proxy-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-domain:
    if: github.event_name == 'workflow_dispatch' || vars.ROMANO_LIVE_QA == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Vercel website, Supabase proxy and catalog images
        env:
          ROMANO_SITE_URL: ${{ vars.ROMANO_SITE_URL }}
        run: node qa/vercel-proxy-smoke.mjs
