name: Vercel Supabase proxy smoke

on:
  pull_request:
    paths:
      - "vercel.json"
      - "qa/vercel-proxy-smoke.mjs"
      - ".github/workflows/vercel-proxy-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Vercel website, Supabase proxy and catalog images
        run: node qa/vercel-proxy-smoke.mjs
