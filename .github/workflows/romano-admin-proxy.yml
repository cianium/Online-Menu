name: ROMANO admin same-domain proxy verification

on:
  pull_request:
    paths:
      - vercel.json
      - qa/supabase-admin-proxy-smoke.mjs
      - .github/workflows/romano-admin-proxy.yml
  push:
    branches: [main]
    paths:
      - vercel.json
      - qa/supabase-admin-proxy-smoke.mjs
      - .github/workflows/romano-admin-proxy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-proxy:
    if: github.event_name == 'workflow_dispatch' || vars.ROMANO_LIVE_QA == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate direct Supabase auth security
        env:
          ROMANO_ADMIN_TEST_URL: ${{ vars.ROMANO_ADMIN_TEST_URL }}
          ROMANO_SITE_URL: ${{ vars.ROMANO_SITE_URL }}
          ROMANO_ADMIN_TEST_DIRECT: "1"
        run: node qa/supabase-admin-proxy-smoke.mjs
      - name: Verify same-domain production proxy
        env:
          ROMANO_SITE_URL: ${{ vars.ROMANO_SITE_URL }}
        run: node qa/supabase-admin-proxy-smoke.mjs
