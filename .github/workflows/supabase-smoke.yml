name: Supabase public API smoke

on:
  pull_request:
    paths:
      - "vercel.json"
      - "qa/supabase-smoke.mjs"
      - ".github/workflows/supabase-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify published menu API and language contract
        run: node qa/supabase-smoke.mjs
