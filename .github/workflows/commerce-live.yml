name: RAMEN commerce live smoke
on:
  pull_request:
    paths:
      - "supabase/functions/romano-order/**"
      - "supabase/functions/romano-payment/**"
      - "supabase/functions/romano-admin/**"
      - "qa/commerce-live-smoke.mjs"
      - ".github/workflows/commerce-live.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || vars.ROMANO_LIVE_QA == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live health and admin authentication boundary
        env:
          ROMANO_FUNCTIONS_BASE_URL: ${{ vars.ROMANO_FUNCTIONS_BASE_URL }}
        run: node qa/commerce-live-smoke.mjs
